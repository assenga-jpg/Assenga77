<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Safari</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Concept: calm editorial app shell. Soft tinted surfaces, one live accent hue (--h) that the app can shift. Twiga the giraffe asks every question. */
:root{
  --h:165;
  --font-display:'Sora','Segoe UI',system-ui,sans-serif;
  --font-body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  --bg:hsl(var(--h) 22% 97%);
  --surface:hsl(0 0% 100%);
  --surface2:hsl(var(--h) 22% 94%);
  --line:hsl(var(--h) 16% 87%);
  --fg:hsl(var(--h) 30% 12%);
  --muted:hsl(var(--h) 10% 38%);
  --ac:hsl(var(--h) 62% 32%);
  --ac-a:hsl(var(--h) 66% 36%);
  --ac-b:hsl(calc(var(--h) + 28) 66% 30%);
  --ac-soft:hsl(var(--h) 55% 93%);
  --ac-line:hsl(var(--h) 45% 74%);
  --good:hsl(148 62% 28%); --good-bg:hsl(148 55% 91%); --good-line:hsl(148 50% 55%);
  --bad:hsl(5 70% 42%); --bad-bg:hsl(5 85% 95%); --bad-line:hsl(5 70% 62%);
  --gold:hsl(42 96% 50%); --gold-d:hsl(36 90% 36%); --gold-soft:hsl(45 100% 92%);
  --shadow:0 1px 2px hsl(var(--h) 30% 20% / .06),0 8px 24px hsl(var(--h) 30% 20% / .07);
  --lock:hsl(var(--h) 10% 84%); --lock-d:hsl(var(--h) 8% 66%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:hsl(var(--h) 22% 8%); --surface:hsl(var(--h) 20% 12%); --surface2:hsl(var(--h) 18% 16%); --line:hsl(var(--h) 14% 23%);
  --fg:hsl(var(--h) 20% 94%); --muted:hsl(var(--h) 10% 70%);
  --ac:hsl(var(--h) 72% 66%); --ac-a:hsl(var(--h) 64% 38%); --ac-b:hsl(calc(var(--h) + 28) 64% 30%);
  --ac-soft:hsl(var(--h) 40% 17%); --ac-line:hsl(var(--h) 40% 34%);
  --good:hsl(148 62% 62%); --good-bg:hsl(148 40% 15%); --good-line:hsl(148 45% 38%);
  --bad:hsl(5 90% 72%); --bad-bg:hsl(5 40% 17%); --bad-line:hsl(5 55% 46%);
  --gold-d:hsl(42 90% 62%); --gold-soft:hsl(42 40% 17%);
  --shadow:0 1px 2px #0006,0 10px 28px #0005;
  --lock:hsl(var(--h) 12% 20%); --lock-d:hsl(var(--h) 10% 32%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) 22% 8%); --surface:hsl(var(--h) 20% 12%); --surface2:hsl(var(--h) 18% 16%); --line:hsl(var(--h) 14% 23%);
  --fg:hsl(var(--h) 20% 94%); --muted:hsl(var(--h) 10% 70%);
  --ac:hsl(var(--h) 72% 66%); --ac-a:hsl(var(--h) 64% 38%); --ac-b:hsl(calc(var(--h) + 28) 64% 30%);
  --ac-soft:hsl(var(--h) 40% 17%); --ac-line:hsl(var(--h) 40% 34%);
  --good:hsl(148 62% 62%); --good-bg:hsl(148 40% 15%); --good-line:hsl(148 45% 38%);
  --bad:hsl(5 90% 72%); --bad-bg:hsl(5 40% 17%); --bad-line:hsl(5 55% 46%);
  --gold-d:hsl(42 90% 62%); --gold-soft:hsl(42 40% 17%);
  --shadow:0 1px 2px #0006,0 10px 28px #0005;
  --lock:hsl(var(--h) 12% 20%); --lock-d:hsl(var(--h) 10% 32%); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-weight:500;font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;transition:background .5s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:320px;pointer-events:none;z-index:0;
  background:radial-gradient(60% 100% at 20% 0%,hsl(var(--h) 70% 60% / .16),transparent 70%),radial-gradient(50% 90% at 90% 0%,hsl(calc(var(--h) + 50) 70% 60% / .12),transparent 70%)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-bottom:104px}
.muted{color:var(--muted)}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:2px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tab{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.01em;transition:background .2s,color .2s}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ac);background:var(--ac-soft)}
.who{display:none}
@media (min-width:900px){
  .tabs{top:0;right:auto;width:216px;flex-direction:column;justify-content:flex-start;gap:4px;padding:22px 14px;border-top:0;border-right:1px solid var(--line)}
  .tab{flex:none;max-width:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;justify-content:flex-start}
  body{padding-left:236px}
  .app{padding-bottom:48px}
  .brand-side{display:block!important}
  .who{display:flex}
}
.brand-side{display:none;font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--ac);padding:0 10px 16px;letter-spacing:-.02em}
.who{margin-top:auto;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.who b{font-weight:700;display:block;line-height:1.2} .who span{font-size:12.5px;color:var(--muted)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--ac-soft);border:1px solid var(--ac-line);flex:none}
/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.hi{display:flex;align-items:center;gap:10px;min-width:0}
.hi small{display:block;color:var(--muted);font-size:12.5px;line-height:1.1}
@media (max-width:420px){.hi small{display:none}.tr{gap:4px}.chip{padding:5px 9px}.ib{width:34px;height:34px}}
.hi b{font-family:var(--font-display);font-size:17px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.chip svg{width:17px;height:17px}
.chip.fire svg{color:hsl(24 95% 52%)} .chip.xp svg{color:var(--ac)}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);box-shadow:var(--shadow)}
.ib svg{width:19px;height:19px}
.ib:hover{color:var(--ac);border-color:var(--ac-line)}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.btn{display:block;width:100%;font-family:var(--font-display);font-weight:600;font-size:15.5px;letter-spacing:.01em;padding:14px 18px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--ac-a),var(--ac-b));
  box-shadow:0 6px 18px hsl(var(--h) 60% 30% / .28),inset 0 1px 0 #ffffff30;transition:transform .12s,box-shadow .12s,filter .2s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px) scale(.995)}
.btn.bad{background:linear-gradient(135deg,hsl(5 72% 50%),hsl(350 70% 42%));box-shadow:0 6px 18px hsl(5 70% 40% / .3)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{background:var(--surface2);color:var(--muted);box-shadow:none;cursor:not-allowed;filter:none}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:14px}
.seg button{flex:1;padding:9px 8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ac);box-shadow:var(--shadow)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);position:relative}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ac)}
.sw button.wide{width:auto;border-radius:999px;padding:0 14px;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 2px #0008}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avs button{aspect-ratio:1;border-radius:12px;font-size:22px;display:grid;place-items:center;background:var(--surface2);border:1px solid transparent}
.avs button[aria-pressed="true"]{border-color:var(--ac);background:var(--ac-soft)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.lab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.inp{width:100%;font:inherit;font-weight:600;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.sw-t{width:46px;height:28px;border-radius:99px;background:var(--lock-d);position:relative;flex:none;transition:background .2s}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0004}
.sw-t[aria-pressed="true"]{background:var(--ac-a)} .sw-t[aria-pressed="true"]::after{transform:translateX(18px)}
/* path */
.goal{display:grid;gap:10px;margin:4px 0 6px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac-a),var(--ac-b));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.dw{display:flex;gap:14px;align-items:center}
.dw .bigw{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.2}
.banner{position:relative;overflow:hidden;margin:30px 0 4px;padding:18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--bh1),var(--bh2));box-shadow:var(--shadow)}
.banner.locked{background:var(--lock);color:var(--muted);box-shadow:none}
.banner .tag{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;opacity:.85}
.banner h2{font-size:22px;margin:2px 0 2px;color:inherit} .banner p{margin:0;font-size:14px;opacity:.92;max-width:72%}
.banner .big-e{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:64px;line-height:1;filter:drop-shadow(0 6px 10px #0003)}
.banner.locked .big-e{filter:grayscale(1) opacity(.45)}
.banner .cnt{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;background:#ffffff26;border-radius:99px;padding:2px 10px}
.banner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#1eb53a 0 25%,#fcd116 25% 50%,#111 50% 75%,#00a3dd 75%);opacity:.95}
.banner.locked::after{opacity:.35}
.scene{position:relative;border-radius:22px;overflow:hidden;margin:6px 0 12px;box-shadow:var(--shadow);border:1px solid var(--line);line-height:0}
.scene svg.sc{width:100%;height:auto;display:block}
:root[data-theme="dark"] .scene svg.sc{filter:brightness(.72) saturate(1.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scene svg.sc{filter:brightness(.72) saturate(1.1)}}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(transparent,#0007);pointer-events:none}
.scene .cap{z-index:1;position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:10px;line-height:1.2;color:#fff;text-shadow:0 1px 6px #0008}
.scene .cap b{font-family:var(--font-display);font-size:19px;font-weight:600;display:block}
.scene .cap span{font-size:12.5px;opacity:.92;font-weight:600}
.flag{display:block;border-radius:4px;box-shadow:0 2px 8px #0006;flex:none}
.tzline{height:5px;border-radius:99px;background:linear-gradient(90deg,#1eb53a 0 25%,#fcd116 25% 50%,#111 50% 75%,#00a3dd 75%);margin:10px 0 0}
.path{display:flex;flex-direction:column;padding:14px 0 4px}
.prow{display:grid;align-items:center;column-gap:16px;min-height:104px;position:relative}
.prow::before{content:"";position:absolute;left:50%;top:-30px;height:52px;border-left:2px dashed var(--line);z-index:0}
.prow:first-child::before{display:none}
.lbl{min-width:0;display:grid;gap:2px}
.lbl b{font-weight:700;font-size:15.5px;line-height:1.25}
.lbl span{font-size:12.5px;color:var(--muted)}
.lbl .stars{color:var(--gold-d);letter-spacing:2px;font-size:13px}
.lbl .now{display:inline-block;width:max-content;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);background:var(--ac-soft);padding:2px 9px;border-radius:99px}
.lbl.r{text-align:right;justify-items:end}
.deco{font-size:34px;text-align:center;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 6px 6px #0002);user-select:none}
.deco.l{text-align:left}
@keyframes float{50%{transform:translateY(-5px) rotate(2deg)}}
.node{position:relative;z-index:1;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--ac-a),var(--ac-b));box-shadow:0 8px 0 hsl(var(--h) 55% 22%),0 14px 22px hsl(var(--h) 50% 20% / .3);transition:transform .1s,box-shadow .1s}
.node:active{transform:translateY(5px);box-shadow:0 3px 0 hsl(var(--h) 55% 22%),0 6px 10px hsl(var(--h) 50% 20% / .3)}
.node svg{width:32px;height:32px}
.node.done{background:linear-gradient(145deg,hsl(46 98% 56%),hsl(36 92% 46%));box-shadow:0 8px 0 hsl(34 80% 28%),0 14px 22px hsl(40 80% 30% / .3)}
.node.test{background:linear-gradient(145deg,hsl(calc(var(--h) + 150) 70% 46%),hsl(calc(var(--h) + 180) 70% 36%));box-shadow:0 8px 0 hsl(calc(var(--h) + 170) 55% 20%),0 14px 22px hsl(var(--h) 40% 20% / .3)}
.node.test.done{background:linear-gradient(145deg,hsl(46 98% 56%),hsl(36 92% 46%));box-shadow:0 8px 0 hsl(34 80% 28%),0 14px 22px hsl(40 80% 30% / .3)}
.node.locked{background:var(--lock);color:var(--lock-d);box-shadow:0 8px 0 var(--lock-d);cursor:not-allowed}
.node.current::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--ac);opacity:.35;animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.88);opacity:.6}100%{transform:scale(1.18);opacity:0}}
.you{position:absolute;right:-12px;top:-14px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--ac);display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.stk{justify-self:center}
/* sheet */
.shade{position:fixed;inset:0;z-index:60;background:rgba(10,20,16,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);color:var(--fg);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.shade{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}} @keyframes fade{from{opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec{margin:26px 0 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--font-body)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
/* lesson overlay */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.ov::before{content:"";position:absolute;inset:0 0 auto;height:260px;pointer-events:none;background:radial-gradient(60% 100% at 30% 0%,hsl(var(--h) 70% 60% / .14),transparent 70%)}
.ov[hidden]{display:none!important}
.ovh{position:relative;display:flex;align-items:center;gap:12px;padding:14px 0 10px;max-width:700px;width:100%;margin:0 auto}
.x{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--surface2)}
.pb{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.pb>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac-a),var(--ac-b));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);position:relative}
.pb>i::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:3px;border-radius:9px;background:#fff5}
.combo{display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px;color:hsl(24 95% 52%);min-width:38px}
.combo svg{width:16px;height:16px}
.ovb{position:relative;flex:1;overflow:auto;max-width:700px;width:100%;margin:0 auto;padding:4px 0 24px}
.q{font-family:var(--font-display);font-size:23px;font-weight:600;margin:6px 0 14px;text-wrap:balance;letter-spacing:-.01em}
.stage{display:flex;align-items:flex-end;gap:10px;margin-bottom:20px}
.tw{width:96px;flex:none;position:relative}
.tw svg{width:100%;height:auto;display:block;overflow:visible}
.tw.hop{animation:hop .5s}
.tw.sad{animation:droop .5s}
@keyframes hop{30%{transform:translateY(-16px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
@keyframes droop{30%{transform:translateY(3px) rotate(-6deg)}60%{transform:rotate(4deg)}}
.eyes{transform-origin:60px 56px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.say-b{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);font-size:19px;font-weight:600;margin-bottom:30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.say-b::before{content:"";position:absolute;left:-8px;bottom:18px;width:14px;height:14px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.spk{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ac-soft);color:var(--ac);border:1px solid var(--ac-line);flex:none}
.spk svg{width:20px;height:20px}
.spk.big{width:60px;height:60px;border-radius:18px}
.spk.big svg{width:28px;height:28px}
.wd{border-bottom:2px dotted transparent}
.wd.tap{border-bottom-color:var(--ac-line);cursor:help}
.opts{display:grid;gap:10px}

/* ================= MESTRING (spaced repetition) ================= */
const BOX_DAYS=[0,1,3,7,14,30];
function word(k){return ST.words[k]||(ST.words[k]={b:0,s:0,w:0,t:0})}
function mark(k,ok){const w=word(k);w.s++;w.t=Date.now();if(ok){w.b=Math.min(5,w.b+1)}else{w.w++;w.b=Math.max(0,w.b-2)}}
function dueScore(it){const w=ST.words[it.key];if(!w)return 0;const age=(Date.now()-w.t)/864e5;return (age>=BOX_DAYS[w.b]?1:0)+(5-w.b)*.3+Math.min(w.w,4)*.2}
function masteryPct(it){const w=ST.words[it.key];return w?w.b/5:0}
function reviewItems(ch,n){const pool=ITEMS.filter(i=>i.ch<ch&&(ST.words[i.key]||ST.skipped.includes(i.ch)));return pool.map(i=>({i,s:dueScore(i)+Math.random()*.4})).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.i)}
function seenItems(){return ITEMS.filter(i=>ST.words[i.key]||ST.skipped.includes(i.ch))}
function trans(text){const k=text.toLowerCase();if(BYKEY[k])return {from:"Norsk",t:BYKEY[k].no};
  const hit=ITEMS.find(i=>i.no.toLowerCase()===k)||ITEMS.find(i=>i.alt.some(a=>a.toLowerCase()===k));return hit?{from:"Swahili",t:hit.sw}:null}

/* ================= ØVELSER ================= */
function distractors(it,n,type){
  const same=ITEMS.filter(x=>x!==it&&x.k===it.k&&x.ch<=it.ch);
  const pool=same.length>=n+2?same:ITEMS.filter(x=>x!==it&&x.k===it.k);
  const f=x=>type==='no'?x.no:x.sw,out=[];
  for(const x of shuffle(pool)){if(f(x).toLowerCase()!==f(it).toLowerCase()&&!out.includes(f(x)))out.push(f(x));if(out.length>=n)break}return out}
function mkChoose(it,dir){
  if(dir==='sw2no')return {type:'choose',item:it,q:"Hva betyr dette?",say:it.sw,opts:shuffle([it.no,...distractors(it,3,'no')]),ans:it.no};
  return {type:'choose',item:it,q:"Hvordan sier du dette på swahili?",show:it.no,opts:shuffle([it.sw,...distractors(it,3,'sw')]),ans:it.sw}}
function mkType(it,dir){
  if(dir==='no2sw')return {type:'type',item:it,q:"Skriv på swahili",show:it.no,ans:it.sw,alts:[],lang:'sw'};
  return {type:'type',item:it,q:"Skriv på norsk",say:it.sw,ans:it.no,alts:it.alt,lang:'no'}}
function mkListen(it,mode){return {type:'listen',item:it,q:mode==='type'?"Hør etter og skriv det du hører":"Hva betyr det du hører?",say:it.sw,mode,opts:mode==='type'?null:shuffle([it.no,...distractors(it,3,'no')]),ans:mode==='type'?it.sw:it.no,alts:mode==='type'?[]:it.alt,lang:mode==='type'?'sw':'no'}}
function mkSpeak(it){return {type:'speak',item:it,q:"Si dette høyt",say:it.sw,show:it.no,ans:it.sw}}
function mkBuild(it){const toks=it.sw.replace(/[?!.,]/g,"").split(" ");if(toks.length<2)return mkType(it,'no2sw');
  const low=toks.map(t=>t.toLowerCase());
  const extra=shuffle(ITEMS.filter(x=>x.k==='w'&&x.ch<=it.ch).map(x=>x.sw.split(" ")[0])).filter(w=>!low.includes(w.toLowerCase())).slice(0,2);
  return {type:'build',item:it,q:"Bygg setningen på swahili",show:it.no,tokens:shuffle([...toks,...extra]),ans:toks.join(" ")}}
function mkMatch(items){return {type:'match',item:items[0],items,q:"Finn parene",pairs:items.map(i=>({a:i.sw,b:i.no,key:i.key}))}}
function buildExercises(items,harder,opts){
  opts=opts||{};const ex=[];
  items.forEach(it=>{
    if(it.k==='s'){ex.push(mkChoose(it,'sw2no'));ex.push(mkBuild(it));ex.push(mkType(it,Math.random()<.5+harder/2?'no2sw':'sw2no'));
      if(opts.listen&&Math.random()<.5)ex.push(mkListen(it,'choose'))}
    else{ex.push(mkChoose(it,'sw2no'));ex.push(mkChoose(it,'no2sw'));ex.push(Math.random()<.35+harder*.6?mkType(it,'no2sw'):mkType(it,'sw2no'));
      if(opts.listen&&Math.random()<.5)ex.push(mkListen(it,Math.random()<.35+harder*.4?'type':'choose'))}
  });
  const words=items.filter(i=>i.k==='w');
  const out=shuffle(ex);
  if(words.length>=4)out.splice(Math.min(4,out.length),0,mkMatch(shuffle(words).slice(0,4)));
  if(opts.speak){const cand=shuffle(items.filter(i=>i.k==='s').concat(items.filter(i=>i.k==='w')));cand.slice(0,2).forEach(it=>out.splice(Math.floor(out.length*(.55+Math.random()*.4)),0,mkSpeak(it)))}
  return out}

function rank(){let r=0;for(let i=0;i<RANKS.length;i++)if(ST.xp>=RANKS[i][0])r=i;const nx=RANKS[r+1];return {n:r+1,title:RANKS[r][1],no:RANKS[r][2],next:nx?nx[0]:null,from:RANKS[r][0]}}
function todaySecs(){const k=dayKey(Date.now());return ST.log.filter(l=>dayKey(l.t)===k).reduce((a,l)=>a+(l.secs||0),0)}
function weekendKey(t){const d=new Date(t);const dow=d.getDay();const sat=new Date(d);sat.setHours(0,0,0,0);if(dow===0)sat.setDate(sat.getDate()-1);else if(dow!==6)return null;return dayKey(sat.getTime())}
function weekendStreak(){
  const set=new Set(ST.log.map(l=>weekendKey(l.t)).filter(Boolean));
  const now=new Date();now.setHours(0,0,0,0);const dow=now.getDay();
  const sat=new Date(now);sat.setDate(sat.getDate()-(dow===6?0:dow===0?1:dow+1));
  let n=0;const isW=dow===6||dow===0;
  if(!set.has(dayKey(sat.getTime()))){if(isW)return 0;sat.setDate(sat.getDate()-7)}
  while(set.has(dayKey(sat.getTime()))){n++;sat.setDate(sat.getDate()-7)}return n}
function weekStats(){const now=new Date();now.setHours(0,0,0,0);const dow=now.getDay();const sat=new Date(now);sat.setDate(sat.getDate()-(dow===6?0:dow===0?1:dow+1));const sun=new Date(sat);sun.setDate(sun.getDate()+1);
  const f=d=>ST.log.filter(l=>dayKey(l.t)===dayKey(d.getTime())).reduce((a,l)=>a+(l.secs||0),0);return {sat:f(sat),sun:f(sun)}}
function topbar(){

/* ---- sti ---- */
function chapterDone(ci){return !!(ST.tests[ci]&&ST.tests[ci].passed)||ST.skipped.includes(ci)}
function lessonDone(ci,li){return ST.skipped.includes(ci)||!!ST.done[ci+"."+li]}
function lessonStars(ci,li){const v=ST.done[ci+"."+li];return ST.skipped.includes(ci)?0:(typeof v==='number'?v:1)}
function chapterUnlocked(ci){return ci===0||chapterDone(ci-1)||ci<=ST.start}
function nextTarget(){for(let ci=0;ci<NCH;ci++){if(chapterDone(ci))continue;for(let li=0;li<CH[ci].lessons.length;li++)if(!lessonDone(ci,li))return {ci,li};return {ci,li:'test'}}return null}
function motiv(sec,goal){const r=sec/goal;if(r===0)return "Du har ikke begynt i dag.";if(r<.5)return "Godt i gang.";if(r<1)return "Over halvveis.";return "Målet er nådd. Alt over dette er bonus."}
function dailyWord(){const seen=seenItems().filter(i=>i.k==='w');const pool=seen.length?seen:ITEMS.filter(i=>i.k==='w'&&i.ch===0);let h=0;const k=dayKey(Date.now());for(const c of k)h=(h*31+c.charCodeAt(0))|0;return pool[Math.abs(h)%pool.length]}
function renderPath(){
  const sec=todaySecs(),goal=ST.goalMin*60,pct=Math.min(100,sec/goal*100),tg=nextTarget(),rk=rank(),dw=dailyWord();
  const rkPct=rk.next?Math.min(100,(ST.xp-rk.from)/(rk.next-rk.from)*100):100;
  let h=savannaScene()+`<div class="card goal"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>Dagens mål</b><span class="muted" style="font-size:14px">${fmtMin(sec)} av ${ST.goalMin} min</span></div><div class="bar"><i style="width:${pct}%"></i></div><span class="muted" style="font-size:13.5px">${motiv(sec,goal)}</span></div>
  <div class="card" style="margin-top:12px;display:grid;gap:14px"><div class="dw"><div class="av" style="width:46px;height:46px;font-size:24px">🔤</div><div style="flex:1;min-width:0"><div class="lab">Dagens ord</div><div class="bigw">${esc(dw.sw)} <span class="muted" style="font-size:15px;font-weight:600">· ${esc(dw.no)}</span></div></div>${canSpeak()?`<button class="spk" id="dwSay" aria-label="Lytt">${I.sound}</button>`:''}</div>
  <div><div style="display:flex;justify-content:space-between;font-size:13.5px"><b>Nivå ${rk.n} · ${rk.title}</b><span class="muted">${rk.next?ST.xp+' / '+rk.next+' XP':'Høyeste nivå'}</span></div><div class="bar" style="margin-top:6px"><i style="width:${rkPct}%"></i></div></div></div>`;
  CH.forEach((c,ci)=>{
    const unl=chapterUnlocked(ci),cd=chapterDone(ci);const nd=c.lessons.filter((_,li)=>lessonDone(ci,li)).length;
    h+=`<div class="banner ${unl?'':'locked'}" style="--bh1:hsl(${c.hue} 62% 36%);--bh2:hsl(${c.hue+34} 60% 26%)"><div class="tag">Kapittel ${c.id}${cd?' · fullført':''}</div><h2>${c.name}</h2><p>${c.sub}</p><span class="cnt">${nd} av ${c.lessons.length} leksjoner</span><div class="big-e" aria-hidden="true">${c.emoji}</div></div><div class="path">`;
    const rows=[...c.lessons.map((l,li)=>({li,t:l.t})),{li:'test',t:'Kapitteltest'}];
    rows.forEach((r,idx)=>{
      const isT=r.li==='test';const d=isT?cd:lessonDone(ci,r.li);const isCur=!!(tg&&tg.ci===ci&&tg.li===r.li);
      const open=isT?(unl&&c.lessons.every((_,li)=>lessonDone(ci,li))):unl&&(d||isCur||ci<ST.start);
      const cls=(isT?'test ':'')+(d?'done':open?'current':'locked');

async function openTeacher(ctx){
  const sh=sheet(`<div class="sh-h"><h2>Spør Twiga</h2><button class="x" data-close aria-label="Lukk">${I.close}</button></div>
   <p class="muted" style="margin:0 0 10px">${ctx.word?`Om «${esc(ctx.word)}»`:ctx.q?'Om oppgaven du er på nå':'Spør om swahili'}. Twiga svarer kort og på norsk.</p>
   <textarea id="tq" class="ta" rows="3" placeholder="${ctx.word?'For eksempel: Hvordan bruker jeg dette ordet i en setning?':'Skriv spørsmålet ditt'}" style="min-height:80px;font-size:16px"></textarea>
   <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" id="tgo">Spør</button>${ctx.q&&!ctx.answered?'<button class="btn sm ghost" id="thint">Gi meg et hint</button>':''}</div><div id="tout"></div>`);
  const out=sh.querySelector("#tout");
  const ask=async(text)=>{out.innerHTML='<div class="teach muted">Twiga tenker ...</div>';
    let sample=null;try{sample=window.claude?await window.claude.use("sample"):null}catch(e){}
    if(!sample){out.innerHTML=`<div class="teach">Twiga kan ikke svare her akkurat nå.${ctx.tip?'\n\nLeksjonens tips:\n'+esc(ctx.tip):''}</div>`;return}
    const reveal=ctx.answered?"Du kan gjerne oppgi riktig svar og forklare hvorfor.":"IKKE oppgi riktig svar. Gi bare et hint som hjelper eleven å komme fram til det selv.";
    const prompt=`Du er Twiga, en streng men vennlig swahili-lærer for William (18 år, norsk, nybegynner til middels). Svar på norsk, kort (maks 5 setninger), konkret og voksent. Bruk gjerne ett eksempel på swahili med norsk oversettelse. Hvis du er usikker, si det rett ut.\n${ctx.word?`Ordet eller uttrykket: ${ctx.word}\n`:''}${ctx.q?`Oppgaven nå: ${ctx.q}${ctx.shown?` (vist: ${ctx.shown})`:''}\nRiktig svar (hemmelig): ${ctx.ans}\n${reveal}\n`:''}${ctx.tip?`Leksjonens tips: ${ctx.tip}\n`:''}Spørsmål fra William: ${text}`;
    try{const r=await sample(prompt,{modelTier:'quick',cache:false});out.innerHTML=`<div class="teach">${esc(r.text||'')}</div>`}
    catch(e){out.innerHTML=`<div class="teach">${e&&e.code==='not_granted'?'Du har ikke gitt tillatelse til å spørre Twiga.':'Fikk ikke svar. Prøv igjen om litt.'}${ctx.tip?'\n\nLeksjonens tips:\n'+esc(ctx.tip):''}</div>`}};
  sh.querySelector("#tgo").onclick=()=>{const v=sh.querySelector("#tq").value.trim();if(v)ask(v)};
  const h=sh.querySelector("#thint");if(h)h.onclick=()=>{if(SS)SS.curHint=true;ask("Gi meg et hint til denne oppgaven.")}}

  if(isCh)body=head+stage(bubble)+`<div class="opts" id="opts">${e.opts.map((o,n)=>`<button class="opt" data-o="${esc(o)}"><kbd>${n+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>`;
  else if(e.type==='type'||(isListen&&e.mode==='type'))body=head+stage(bubble)+`<textarea class="ta" id="ta" rows="2" placeholder="Skriv svaret her" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Svar"></textarea>`;
  else if(e.type==='build')body=head+stage(esc(e.show))+`<div class="ans" id="ans"></div><div class="bank" id="bank">${e.tokens.map((t,n)=>`<button class="tile" data-n="${n}">${esc(t)}</button>`).join("")}</div>`;
  else if(e.type==='match'){
    const L=shuffle(e.pairs.map(p=>({t:p.a,k:p.key}))),R=shuffle(e.pairs.map(p=>({t:p.b,k:p.key})));
    body=head+stage("Finn hvert ord og dets betydning.")+`<div class="pairs" id="pairs"><div style="display:grid;gap:10px">${L.map(x=>`<button class="opt" data-k="${esc(x.k)}" data-s="a">${esc(x.t)}</button>`).join("")}</div><div style="display:grid;gap:10px">${R.map(x=>`<button class="opt" data-k="${esc(x.k)}" data-s="b">${esc(x.t)}</button>`).join("")}</div></div>`}
  else if(e.type==='speak')body=head+stage(`${spk}<span>${esc(e.say)}</span>`)+`<p class="muted" style="margin:0 0 6px;text-align:center">${esc(e.show)}</p><div class="mic"><button class="micb" id="mic" aria-label="Snakk">${I.mic}</button><div class="heard" id="heard">Trykk og si setningen høyt</div></div><button class="dunno" id="skipSp">Kan ikke snakke nå. Hopp over.</button>`;
  const tools=(SS.kind==='placement'||e.type==='match'||e.type==='speak')?'':`<div class="tools"><button class="tl" id="tHint">${I.bulb}Tips</button><button class="tl" id="tAsk">${I.chat}Spør Twiga</button></div>`;
  const dk=SS.kind==='placement'?'<button class="dunno" id="dk">Jeg vet ikke</button>':'';
  const needChk=!['match','speak'].includes(e.type)&&!isCh;
  ovShell(`<div class="ovb" id="qb">${body}${tools}${dk}<div id="hintbox"></div></div><div class="fb" id="fb"><div class="fbi">${needChk?'<button class="btn" id="chk" disabled>Sjekk</button>':'<div style="height:48px"></div>'}</div></div>`,progressPct());
  const sp=$("#sp");if(sp){sp.onclick=()=>speak(e.say);if(isListen)setTimeout(()=>speak(e.say),300)}
  bindQ(e)}
function bindQ(e){
  const chk=$("#chk"),isListen=e.type==='listen',isCh=e.type==='choose'||(isListen&&e.mode==='choose');
  const th=$("#tHint");if(th){if(SS.noHint)th.style.display='none';else th.onclick=()=>{SS.curHint=true;let t=SS.intro&&SS.intro.tip?SS.intro.tip:'';
    if(e.type==='type'||(isListen&&e.mode==='type'))t=(t?t+'\n':'')+`Svaret begynner på «${e.ans[0]}» og har ${e.ans.split(' ').length} ord.`;
    if(!t)t="Ingen tips for denne øvelsen. Les spørsmålet en gang til.";
    $("#hintbox").innerHTML=`<div class="tip" style="margin-top:12px"><b>Tips.</b> ${esc(t)}</div>`}}
  const ta2=$("#tAsk");if(ta2)ta2.onclick=()=>openTeacher({q:e.q,shown:e.say||e.show,ans:e.ans,tip:SS.intro&&SS.intro.tip,answered:SS.state==='fb'});
  if(isCh){
    document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=ev=>{
      if(SS.state==='ask'){SFX.tap();judge(e,b.dataset.o,false,ev)}
      else showTrans(b)})}
  else if(e.type==='type'||(isListen&&e.mode==='type')){
    const ta=$("#ta");ta.oninput=()=>{chk.disabled=!ta.value.trim()};ta.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();if(SS.state==='ask'){if(!chk.disabled)chk.click()}else $("#nx")&&$("#nx").click()}};setTimeout(()=>ta.focus(),60);
    chk.onclick=ev=>judge(e,ta.value,false,ev)}
  else if(e.type==='build'){
    const picked=[];const ans=$("#ans"),bank=$("#bank");
    const redraw=()=>{ans.innerHTML=picked.map((p,i)=>`<button class="tile" data-i="${i}">${esc(e.tokens[p])}</button>`).join("");
      bank.querySelectorAll(".tile").forEach(t=>t.classList.toggle("used",picked.includes(+t.dataset.n)));chk.disabled=!picked.length;
      ans.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(SS.state!=='ask')return;SFX.tap();picked.splice(+t.dataset.i,1);redraw()})};
    bank.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(SS.state!=='ask')return;const n=+t.dataset.n;if(picked.includes(n))return;SFX.tap();picked.push(n);redraw()});
    chk.onclick=ev=>judge(e,picked.map(p=>e.tokens[p]).join(" "),false,ev)}
  else if(e.type==='match'){
    let first=null,left=e.pairs.length,wrong=0;
    document.querySelectorAll("#pairs .opt").forEach(b=>b.onclick=()=>{
      if(SS.state==='fb'||b.classList.contains("ok"))return;SFX.tap();
      if(!first){first=b;b.classList.add("sel");return}
      if(first===b){b.classList.remove("sel");first=null;return}
      if(first.dataset.s===b.dataset.s){first.classList.remove("sel");first=b;b.classList.add("sel");return}
      if(first.dataset.k===b.dataset.k){[first,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok")});mark(b.dataset.k,true);left--;SFX.ok(left);const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,5,50);first=null;
        if(!left){SS.done++;SS.first.t++;if(!wrong)SS.first.c++;else SS.miss.push(e.pairs[0].key);SS.xpGain=(SS.xpGain||0)+(wrong?5:10);if(!wrong)SS.combo++;else SS.combo=0;SS.state='fb';mood('happy');fbShow(true,wrong?"Ferdig, men du bommet underveis.":"Alle par riktige.",null)}}
      else{[first,b].forEach(x=>{x.classList.remove("sel");x.classList.add("bad")});mark(first.dataset.k,false);wrong++;SFX.bad();buzz(80);const f=first;setTimeout(()=>{f.classList.remove("bad");b.classList.remove("bad")},500);first=null}})}
  else if(e.type==='speak'){bindSpeak(e)}
  const dk=$("#dk");if(dk)dk.onclick=ev=>judge(e,null,true,ev);
  document.onkeydown=ev=>{if(!SS||$("#ov").hidden||$("#layer").children.length)return;
    const tag=document.activeElement.tagName;
    if(SS.state==='ask'&&/^[1-4]$/.test(ev.key)&&tag!=='TEXTAREA'){const o=document.querySelectorAll("#opts .opt")[+ev.key-1];if(o)o.click()}
    else if(ev.key==='Enter'&&tag!=='TEXTAREA'&&document.activeElement.id!=='nx'){const b=SS.state==='fb'?$("#nx"):$("#chk");if(b&&!b.disabled)b.click()}}}
function bindSpeak(e){
  const mic=$("#mic"),heard=$("#heard");let rec=null,tries=0,got=false;
  $("#skipSp").onclick=()=>{SS.total=Math.max(1,SS.total-1);nextQ()};
  mic.onclick=()=>{if(SS.state!=='ask')return;
    if(rec){try{rec.stop()}catch(x){}return}
    if(!canMic()){heard.textContent="Mikrofonen er ikke tilgjengelig her. Du kan hoppe over.";return}
    mic.classList.add("rec");heard.textContent="Lytter ...";got=false;
    rec=listenOnce('sw-KE',alts=>{got=true;mic.classList.remove("rec");rec=null;const best=Math.max(...alts.map(a=>sim(a,e.ans)));heard.textContent="Jeg hørte: «"+alts[0]+"»";
        judge(e,alts[0],false,null,best>=.72)},
      err=>{mic.classList.remove("rec");rec=null;if(got)return;
        if(err==='not-allowed'||err==='service-not-allowed'){heard.textContent="Mikrofonen er blokkert i denne visningen. Du kan hoppe over.";return}
        if(err==='no-speech'||err==='end'||err==='aborted'){tries++;heard.textContent=tries>=2?"Hører ingenting. Sjekk mikrofonen, eller hopp over.":"Hørte ingenting. Prøv igjen.";return}
        heard.textContent="Noe gikk galt med talegjenkjenningen. Prøv igjen eller hopp over."})}}
function showTrans(btn){
  document.querySelectorAll(".bub").forEach(x=>x.remove());
  const text=btn.dataset.o||btn.textContent.trim();const t=trans(text);
  const b=document.createElement("span");b.className="bub";b.innerHTML=t?`<small>${t.from==='Norsk'?'på norsk':'på swahili'}</small>${esc(t.t)}`:`<small>ingen oversettelse</small>`;
  btn.appendChild(b);SFX.tap();setTimeout(()=>b.remove(),2600)}
function judge(e,val,dunno,ev,forced){
  if(SS.state!=='ask')return;
  let ok=false,near=false;const isCh=e.type==='choose'||(e.type==='listen'&&e.mode==='choose');
  if(forced!==undefined)ok=forced;
  else if(!dunno){
    if(isCh)ok=val===e.ans||(e.alts||[]).includes(val);
    else{const v=norm(val);const cands=[e.ans,...(e.alts||[])].map(norm);ok=cands.includes(v);if(!ok)near=cands.some(c=>c.length>=5&&lev(c,v)<=1)}}
  mark(e.item.key,ok);SS.state='fb';
  const hinted=SS.curHint&&!SS.noHint;
  if(SS.kind==='placement'){PL.lastOk=ok;if(ok)PL.right++;SS.first.t++;if(ok)SS.first.c++}
  else{
    const first=!e.retry;
    if(ok){SS.done++;SS.xpGain=(SS.xpGain||0)+(first?(hinted?5:10):4);if(first&&!hinted)SS.first.c++;SS.combo++}
    else{SS.combo=0;if(!SS.miss.includes(e.item.key))SS.miss.push(e.item.key);if(!SS.noRetry){const r=Object.assign({},e,{retry:true});if(r.opts)r.opts=shuffle(r.opts);SS.queue.splice(Math.min(SS.queue.length,3),0,r)}else SS.done++}
    if(first)SS.first.t++}
  if(isCh){document.querySelectorAll("#opts .opt").forEach(b=>{if(b.dataset.o===e.ans)b.classList.add("ok");else if(b.dataset.o===val&&!ok)b.classList.add("bad")})}
  const ta=$("#ta");if(ta){ta.readOnly=true;ta.classList.add(ok?"ok":"bad")}
  const bank=$("#bank"),ans=$("#ans");if(ans)ans.querySelectorAll(".tile").forEach(t=>t.style.borderColor=ok?'var(--good-line)':'var(--bad-line)');
  if(bank)bank.querySelectorAll(".tile").forEach(t=>t.disabled=true);
  const cmb=$("#cmb");if(cmb)cmb.innerHTML=SS.combo>=3?I.fire+SS.combo:'';
  const pbi=document.querySelector(".pb>i");if(pbi)pbi.style.width=progressPct()+"%";
  document.querySelectorAll(".wd").forEach(w=>{const tr=trans(w.dataset.w);if(tr){w.classList.add("tap");w.onclick=()=>{document.querySelectorAll(".bub").forEach(x=>x.remove());const b=document.createElement("span");b.className="bub";b.style.left="0";b.innerHTML=`<small>${tr.from==='Norsk'?'på norsk':'på swahili'}</small>${esc(tr.t)}`;w.style.position="relative";w.appendChild(b);setTimeout(()=>b.remove(),2400)}}});
  let pt={x:innerWidth/2,y:innerHeight*.5};const t=ev&&ev.currentTarget&&ev.currentTarget.getBoundingClientRect?ev.currentTarget.getBoundingClientRect():(ev&&ev.target&&ev.target.getBoundingClientRect?ev.target.getBoundingClientRect():null);if(t)pt={x:t.left+t.width/2,y:t.top+t.height/2};
  if(ok){SFX.ok(SS.combo);buzz(25);mood('happy');burst(pt.x,pt.y,9,90)}else{SFX.bad();buzz([60,40,60]);mood('sad');const qb=$("#qb");if(qb){qb.classList.remove('shake');void qb.offsetWidth;qb.classList.add('shake')}}
  const strict=near?"Nesten, men en stavefeil er en feil. Riktig svar er:":dunno?"Greit å innrømme. Riktig svar er:":pick(["Feil. Riktig svar er:","Ikke riktig. Riktig svar er:","Nei. Riktig svar er:"]);
  const swAns=e.type==='build'||e.lang==='sw'||(isCh&&e.ans===e.item.sw)||e.type==='speak';
  const okMsg=SS.combo>=5?`${SS.combo} på rad. Hold tempoet.`:pick(["Riktig.","Riktig.","Helt riktig.","Det satt."]);
  if(SS.kind==='placement')fbShow(ok,ok?"Riktig.":(dunno?"Ærlig svar. Riktig svar er:":"Feil. Riktig svar er:"),ok?null:e.ans,e);
  else fbShow(ok,ok?okMsg:strict,ok?null:e.ans+(swAns&&e.item.k==='s'?`  (${e.item.no})`:''),e)}
function fbShow(ok,title,sub,e){
  SS.state='fb';const fb=$("#fb");fb.className="fb "+(ok?"ok":"bad");
  const why=!ok&&e&&!SS.noHint&&SS.kind!=='placement'?`<button class="lnk" id="why">Hvorfor?</button>`:'';
  fb.innerHTML=`<div class="fbi"><div><div class="fbt">${esc(title)}</div>${sub?`<p class="fbm"><b>${esc(sub)}</b></p>`:''}${why?`<div class="fbx" style="margin-top:6px">${why}</div>`:''}</div><button class="btn ${ok?'':'bad'}" id="nx">Fortsett</button></div>`;
  const w=$("#why");if(w)w.onclick=()=>openTeacher({q:e.q,shown:e.say||e.show,ans:e.ans,tip:SS.intro&&SS.intro.tip,answered:true});
  $("#nx").onclick=()=>{if(SS.kind==='placement')return placeNext();nextQ()};
  setTimeout(()=>{const n=$("#nx");n&&n.focus()},60)}

/* ---- ferdig ---- */
function finishSession(){
  const secs=Math.round((Date.now()-SS.t0)/1000);const total=SS.first.t||1,c=SS.first.c,pct=Math.round(c/total*100);
  const passed=SS.pass==null?null:pct>=SS.pass;
  const stars=passed===false?0:pct>=95?3:pct>=85?2:1;
  let xp=Math.round(SS.xpGain||0);if(passed===false)xp=Math.round(xp*.4);ST.xp+=xp;
  ST.log.push({t:Date.now(),title:SS.title,kind:SS.kind,correct:c,total,secs,xp,passed,stars});
  if(SS.kind==='lesson'&&passed){const k=SS.ci+"."+SS.li;const old=ST.done[k];ST.done[k]=Math.max(stars,typeof old==='number'?old:0)}
  if(SS.kind==='test'){const t=ST.tests[SS.ci]||{best:0,tries:0};t.tries++;t.best=Math.max(t.best,pct);if(passed)t.passed=true;ST.tests[SS.ci]=t}
  const newB=BADGES.filter(b=>!ST.badges.includes(b.id)&&b.f(ST));newB.forEach(b=>ST.badges.push(b.id));
  save();
  const missed=[...new Set(SS.miss)].map(k=>BYKEY[k]).filter(Boolean);
  const cls=passed===false?'fail':'pass';
  const showStars=(SS.kind==='lesson'||SS.kind==='test')&&passed;
  $("#ov").innerHTML=`<div class="ovh"><div style="flex:1"></div></div><div class="ovb"><div class="res ${cls}">
   ${showStars?`<div class="stars-big">${[1,2,3].map(n=>I.star.replace('<svg','<svg class="'+(n<=stars?'on':'')+'"')).join("")}</div>`:`<div class="tw" id="tw" style="width:110px">${twiga()}</div>`}
   <div class="big">${pct} %</div><h2>${passed===false?'Ikke bestått':passed?(SS.kind==='test'?'Kapittel fullført':'Leksjon fullført'):'Økt ferdig'}</h2><p style="margin:0;max-width:440px">${verdictText(pct,SS.pass,SS.kind)}</p>
   <div class="stats"><div class="stat"><b>${c}/${total}</b><span>Rett første gang</span></div><div class="stat"><b>+${xp}</b><span>XP</span></div><div class="stat"><b>${fmtMin(secs)}</b><span>Tid</span></div></div>
   ${newB.map(b=>`<div class="badge-new"><div class="e">${b.e}</div><div><b>Nytt merke: ${b.n}</b><div class="muted" style="font-size:13px">${b.d}</div></div></div>`).join("")}
   ${missed.length?`<div class="card miss"><h3 style="margin-bottom:6px">Dette bommet du på</h3>${missed.map(m=>`<div class="row"><b>${esc(m.sw)}</b><span class="muted">${esc(m.no)}</span></div>`).join("")}</div>`:''}</div></div>
  <div class="fb"><div class="fbi"><button class="btn ${passed===false?'bad':''}" id="fin">${passed===false?'Ta den igjen':'Fortsett'}</button>${passed===false?'<button class="btn ghost" id="fin2">Tilbake</button>':''}</div></div>`;
  if(passed===false){mood('sad');SFX.fail();buzz([80,50,80])}else{mood('happy');SFX.done();buzz(40);rain();for(let i=1;i<=stars;i++)setTimeout(()=>SFX.star(i),i*260)}
  const keep=SS;const redo=SS.kind==='lesson'?()=>startLesson(keep.ci,keep.li):SS.kind==='test'?()=>startTest(keep.ci):null;
  $("#fin").onclick=()=>{if(passed===false&&redo){redo()}else closeOv()};const f2=$("#fin2");if(f2)f2.onclick=closeOv;SS.state='done'}
function verdictText(p,pass,kind){
  if(kind==='test'){if(p>=95)return "Du kan dette. Ta det med deg videre.";if(p>=80)return "Bestått, men ikke imponerende. Repeter ordene du bommet på før neste kapittel.";return "Du kan ikke dette godt nok ennå. Det er helt greit, men du går ikke videre før du har tatt testen igjen."}
  if(p>=95)return "Nesten perfekt.";if(p>=85)return "Solid.";
  if(pass!=null&&p>=pass)return "Greit nok, men det er ord her du ikke sitter på. De kommer tilbake i repetisjonen.";
  if(pass!=null)return "Ikke bra nok. Du trenger "+pass+" %. Ta leksjonen igjen og les introduksjonen nøye.";
  if(p>=70)return "Greit. Men noen ord sitter fortsatt ikke.";return "Mange feil. Da var repetisjon akkurat det du trengte."}

/* ================= KARTLEGGING ================= */
function startPlacement(){
  PL={ci:0,results:[],qs:null,n:0,right:0};
  SS={kind:'placement',title:"Kartlegging",first:{c:0,t:0},queue:[],total:NCH*3,done:0,miss:[],t0:Date.now(),state:'ask',combo:0,pass:null,noRetry:true,noHint:true};
  $("#ov").hidden=false;document.body.style.overflow="hidden";placeBatch()}
function placeBatch(){
  const ci=PL.ci;const its=shuffle(ITEMS.filter(i=>i.ch===ci));const w=its.filter(i=>i.k==='w'),s=its.filter(i=>i.k==='s');
  const sel=[w[0],w[1],s[0]||w[2]].filter(Boolean);
  PL.qs=sel.map((i,n)=>i.k==='s'?(ci>=4&&n===2?mkBuild(i):mkChoose(i,'sw2no')):(n===1&&ci>=1?mkType(i,'no2sw'):mkChoose(i,n===0?'sw2no':'no2sw')));
  PL.right=0;PL.n=0;PL.lastOk=undefined;showPl()}
function showPl(){SS.cur=PL.qs[PL.n];SS.state='ask';SS.done=PL.results.length*3+PL.n;renderQ()}
function placeNext(){
  PL.n++;
  if(PL.n>=PL.qs.length){PL.results.push(PL.right);const r=PL.results,stop=PL.right===0||(r.length>=2&&r[r.length-1]<=1&&r[r.length-2]<=1);PL.ci++;if(stop||PL.ci>=NCH)return placeEnd();return placeBatch()}
  showPl()}
function placeEnd(){
  const r=PL.results;let start=0;while(start<r.length&&r[start]>=2)start++;
  ST.placed=true;ST.start=Math.min(start,NCH-1);ST.skipped=[];for(let i=0;i<ST.start;i++)ST.skipped.push(i);
  const secs=Math.round((Date.now()-SS.t0)/1000);ST.log.push({t:Date.now(),title:"Kartleggingstest",kind:'placement',correct:SS.first.c,total:SS.first.t,secs,xp:20,passed:null});ST.xp+=20;save();
  const lines=r.map((x,i)=>`<div class="row"><span>${CH[i].emoji} <b>${CH[i].id}.</b> ${CH[i].name}</span><span class="pill ${x>=2?'g':'r'}">${x}/3</span></div>`).join("");
  const msg=ST.start===0?"Du starter helt fra begynnelsen. Basisen må sitte før noe annet, så det er riktig sted å begynne.":ST.start>=NCH-1?"Du kan mye. Du starter på siste kapittel.":`Du kan det meste i kapittel 1 til ${ST.start}. Du starter på kapittel ${ST.start+1}. Gamle kapitler kommer tilbake som repetisjon.`;
  $("#ov").innerHTML=`<div class="ovh"><div style="flex:1"></div></div><div class="ovb"><div class="res pass"><div class="tw" id="tw" style="width:110px">${twiga()}</div><h2>Resultat</h2><p style="margin:0;max-width:440px">${msg}</p><div class="card miss">${lines}</div><p class="muted" style="font-size:14px;margin:0">Testen gir bare et grovt bilde. Noen ord er sikkert glemt likevel.</p></div></div>
  <div class="fb"><div class="fbi"><button class="btn" id="fin">Start løypa</button></div></div>`;
  mood('happy');SFX.done();$("#fin").onclick=()=>{cur='path';window.__scrolled=0;closeOv()};SS.state='done'}

/* ================= OPPSTART ================= */
applyTheme();render();initStore();
</script>
