<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EF">
<title>Catholic Faith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF7EF; --ivory:#F4ECDD; --paper:#FFFDF8;
  --ink:#3A2A1E; --ink-soft:#7A6552; --gold:#B8923A; --gold-soft:#E7D3A1;
  --line:rgba(58,42,30,.12);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(1200px 700px at 50% -10%,#fff 0%,var(--ivory) 60%,#EADFC8 100%);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* Telefon-ramme: full skjerm på mobil, smal kolonne på PC */
.phone{position:relative;margin:0 auto;height:100dvh;max-width:440px;overflow:hidden;background:var(--cream);box-shadow:0 0 80px rgba(80,55,20,.18)}

/* ---------- VELKOMST ---------- */
#splash{position:absolute;inset:0;z-index:50;background:#0c0907;overflow:hidden;cursor:pointer}
#splash .pope{position:absolute;inset:-4%;background:url(assets/pave.webp) 50% 18%/cover no-repeat;
  animation:popeIn 3.4s var(--ease) forwards, drift 22s ease-in-out 3.4s infinite alternate;transform-origin:50% 30%}
@keyframes popeIn{
  0%{filter:blur(26px) brightness(.25) saturate(.6);transform:scale(1.5)}
  55%{filter:blur(4px) brightness(.95) saturate(1)}
  100%{filter:blur(0) brightness(1) saturate(1);transform:scale(1.08)}}
@keyframes drift{from{transform:scale(1.08) translate3d(0,0,0)}to{transform:scale(1.2) translate3d(-1.5%,-1%,0)}}
#splash .veil{position:absolute;inset:0;opacity:0;animation:veilIn 2.2s ease 1.5s forwards;
  background:linear-gradient(180deg,rgba(255,252,246,.62) 0%,rgba(255,250,240,.74) 55%,rgba(255,248,235,.88) 100%)}
@keyframes veilIn{to{opacity:1}}
#splash .leak{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;transform:translateX(-130%);
  background:linear-gradient(105deg,transparent 28%,rgba(255,196,120,.55) 42%,rgba(255,255,255,.85) 50%,rgba(255,220,170,.5) 58%,transparent 72%);
  animation:leak 1.8s ease-in-out 1.1s forwards}
@keyframes leak{to{transform:translateX(130%)}}
#splash .dust{position:absolute;inset:0;pointer-events:none;opacity:0;animation:veilIn 2s ease 2.2s forwards;
  background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#fff,transparent),
  radial-gradient(3px 3px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,#fff,transparent),radial-gradient(2px 2px at 10% 85%,#fff,transparent)}
.welcome{position:absolute;left:0;right:0;top:21%;transform:translateY(-50%);text-align:center;padding:0 24px}
.welcome .kicker{font-family:var(--sans);font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-soft);opacity:0;animation:rise 1.2s var(--ease) 2.2s forwards}
.welcome .name{display:block;margin-top:10px;font-family:var(--serif);font-weight:600;font-size:clamp(54px,17vw,76px);line-height:1;color:var(--ink);white-space:nowrap}
.welcome .name span{display:inline-block;opacity:0;transform:translateY(18px) scale(.9);filter:blur(8px);
  animation:letter .9s var(--ease) forwards;text-shadow:0 0 22px rgba(184,146,58,.55)}
@keyframes letter{60%{text-shadow:0 0 28px rgba(184,146,58,.8)}to{opacity:1;transform:none;filter:blur(0);text-shadow:0 0 14px rgba(184,146,58,.28)}}
.welcome .rule{width:0;height:1px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:rule 1.4s var(--ease) 3.4s forwards}
@keyframes rule{to{width:180px}}
.enter{position:absolute;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));text-align:center;opacity:0;animation:rise 1s var(--ease) 4.1s forwards}
.enter b{display:inline-block;font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink);
  padding:14px 26px;border:1px solid rgba(58,42,30,.28);border-radius:999px;background:rgba(255,253,248,.55);backdrop-filter:blur(6px);animation:pulse 2.4s ease-in-out 5s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(184,146,58,.12);border-color:rgba(184,146,58,.7)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#splash.leaving{pointer-events:none;animation:leave 1.05s var(--ease) forwards}
@keyframes leave{35%{filter:brightness(1.35);transform:scale(1.05)}100%{opacity:0;transform:scale(1.3);filter:blur(14px) brightness(1.6)}}
#flash{position:absolute;inset:0;z-index:60;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash 1.05s ease forwards}
@keyframes flash{30%{opacity:.85}100%{opacity:0}}

/* ---------- APP ---------- */
#app{position:absolute;inset:0;visibility:hidden}
#app.on{visibility:visible}
.bg{position:absolute;inset:0;z-index:0;background:url(assets/jesus.webp) 50% 18%/cover no-repeat;opacity:.34;filter:saturate(.8)}
.bgfade{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(251,247,239,.25) 0%,rgba(251,247,239,.5) 45%,rgba(251,247,239,.78) 100%)}
.view{position:absolute;inset:0;z-index:1;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 20px 130px;display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.active{display:block}
.reveal>*{opacity:0;transform:translateY(16px)}
#app.on .view.active .reveal>*{animation:rise .8s var(--ease) forwards}
#app.on .view.active .reveal>*:nth-child(1){animation-delay:.15s}
#app.on .view.active .reveal>*:nth-child(2){animation-delay:.3s}
#app.on .view.active .reveal>*:nth-child(3){animation-delay:.45s}
#app.on .view.active .reveal>*:nth-child(4){animation-delay:.6s}
#app.on .view.active .reveal>*:nth-child(5){animation-delay:.75s}

header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold);margin-top:-2px;font-weight:500}
.tools{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,248,.8);overflow:hidden}
.lang button{padding:7px 11px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-soft)}
.lang button.on{background:var(--ink);color:#fff}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:19px;color:#fff;background:linear-gradient(135deg,#C9A24B,#8B6A2B);box-shadow:0 4px 14px rgba(139,106,43,.35)}

.paint{background-image:url(assets/maleri1.webp);background-repeat:no-repeat}
.verse{position:relative;border-radius:26px;overflow:hidden;color:#fff;padding:24px 22px 20px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:10px;
  box-shadow:0 18px 40px -16px rgba(60,45,20,.5)}
.verse .pic{position:absolute;inset:0;background-size:170%;background-position:50% 12%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-1.5%,1%)}}
.verse::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,22,12,.28),rgba(30,22,12,.62))}
.verse>*:not(.pic){position:relative;z-index:1}
.verse .meta{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.verse q{font-family:var(--serif);font-size:25px;line-height:1.25;font-weight:500;quotes:"“" "”"}
.verse .ref{font-size:13px;letter-spacing:.14em;opacity:.92}
.row{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:13px 10px;border-radius:14px;font-size:14px;font-weight:500;letter-spacing:.03em;backdrop-filter:blur(10px);transition:transform .2s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:rgba(214,176,92,.72);color:#fff}
.btn.glass{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.28)}

h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:28px 0 4px}
.sub{font-size:13px;color:var(--ink-soft)}
.journey{display:flex;align-items:flex-end;justify-content:space-between}
.streak{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;background:rgba(255,253,248,.85);border:1px solid var(--line);padding:8px 12px;border-radius:999px}
.days{display:flex;justify-content:space-between;margin:16px 0 14px}
.day{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--ink-soft);border:1px solid var(--line);background:rgba(255,253,248,.7)}
.day.today{border:2px solid var(--gold);color:var(--ink);font-weight:600}
.day.done{background:var(--gold);border-color:var(--gold);color:#fff}
.begin{width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,#fffdf8,#F1E6CC);border:1px solid var(--gold-soft);font-family:var(--serif);font-size:20px;font-weight:600;transition:transform .2s var(--ease)}
.begin:active{transform:scale(.985)}
.begin.done{background:var(--gold);color:#fff;border-color:var(--gold)}

.chatrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -20px 0;padding:0 20px 6px;scrollbar-width:none}
.chatrow::-webkit-scrollbar{display:none}
.cat{position:relative;flex:0 0 46%;aspect-ratio:3/3.6;border-radius:22px;overflow:hidden;scroll-snap-align:start;text-align:left;color:#fff;box-shadow:0 12px 28px -14px rgba(60,45,20,.55);transition:transform .35s var(--ease)}
.cat:active{transform:scale(.97)}
.cat .pic{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.cat:hover .pic{transform:scale(1.1)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(25,18,10,.72))}
.cat span{position:absolute;left:14px;right:12px;bottom:13px;z-index:1;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1}

.soon{margin-top:26px;padding:20px;border-radius:20px;background:rgba(255,253,248,.86);border:1px solid var(--line)}
.soon h3{font-family:var(--serif);font-size:21px;margin-bottom:4px}
.empty{padding-top:90px;text-align:center}
.empty h1{font-family:var(--serif);font-size:38px;font-weight:600}
.empty p{margin:10px auto 0;max-width:290px;color:var(--ink-soft);line-height:1.5;font-size:14px}

nav.tabs{position:absolute;left:18px;right:18px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:space-around;padding:10px 8px;border-radius:26px;
  background:rgba(255,253,248,.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 34px -12px rgba(60,45,20,.35)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 24px;font-size:11px;letter-spacing:.08em;color:var(--ink-soft);transition:color .25s}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{stroke:var(--gold)}

#toast{position:absolute;left:50%;bottom:112px;transform:translate(-50%,20px);z-index:70;background:var(--ink);color:#fff;font-size:13px;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.35s var(--ease);max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- LES (Bibelen) ---------- */
.rd{animation:rise .5s var(--ease) both}
.rd h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.05}
.rd .lead{font-size:13px;color:var(--ink-soft);margin:4px 0 16px}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(255,253,248,.85);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;padding:10px 6px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-soft);transition:.25s var(--ease)}
.seg button.on{background:var(--ink);color:#fff}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,253,248,.9);font:inherit;font-size:14px;color:var(--ink);margin-bottom:14px;outline:none}
.search:focus{border-color:var(--gold)}
.resume{display:block;width:100%;text-align:left;padding:16px 18px;border-radius:18px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#8B6A2B,#C9A24B);box-shadow:0 12px 26px -14px rgba(139,106,43,.7)}
.resume small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.resume b{font-family:var(--serif);font-size:24px;font-weight:600}
.books{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.book{padding:14px 14px 12px;border-radius:16px;text-align:left;background:rgba(255,253,248,.88);border:1px solid var(--line);font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.1;transition:transform .2s var(--ease),border-color .2s}
.book:active{transform:scale(.97);border-color:var(--gold)}
.book small{display:block;margin-top:4px;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink-soft)}
.book.deu::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);padding:6px 0 12px}
.chs{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}
.chs button{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500;background:rgba(255,253,248,.88);border:1px solid var(--line);transition:.2s var(--ease)}
.chs button:active{background:var(--gold);color:#fff;border-color:var(--gold)}
.rtools{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rtools .sz{display:flex;gap:6px}
.rtools .sz button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,253,248,.85);font-family:var(--serif);font-weight:600}
.text{font-family:var(--serif);color:var(--ink);line-height:1.7;margin-top:6px;padding:14px 16px;border-radius:22px;background:rgba(255,253,248,.86);border:1px solid var(--line);backdrop-filter:blur(6px)}
.text .v{cursor:pointer;border-radius:4px;transition:background .2s}
.text .v sup{font-family:var(--sans);font-size:.5em;font-weight:600;color:var(--gold);margin:0 3px 0 5px;vertical-align:super}
.text .v.sel{background:rgba(214,176,92,.38)}
.chnav{display:flex;gap:10px;margin:26px 0 8px}
.chnav button{flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:500;background:rgba(255,253,248,.9);border:1px solid var(--line)}
.chnav button:disabled{opacity:.35}
.src{font-size:11px;line-height:1.5;color:var(--ink-soft);margin-top:14px}
.src a{color:var(--gold)}
.selbar{position:absolute;left:18px;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;display:none;gap:10px;padding:10px;border-radius:20px;background:var(--ink);box-shadow:0 14px 34px -10px rgba(30,20,10,.55)}
.selbar.show{display:flex}
.selbar button{flex:1;padding:11px;border-radius:12px;color:#fff;font-size:14px;font-weight:500;background:rgba(255,255,255,.14)}
.selbar button.g{background:var(--gold)}

@media (prefers-reduced-motion:reduce){
  #splash .pope,#splash .leak,.verse .pic{animation:none!important}
  #splash .pope{filter:none;transform:scale(1.05)}
  .welcome .name span,.welcome .kicker,.enter,#splash .veil,#splash .dust,.reveal>*{animation-duration:.01s!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<div class="phone">

  <!-- Velkomst -->
  <section id="splash" aria-label="Velkomst" tabindex="0">
    <div class="pope"></div>
    <div class="veil"></div>
    <div class="dust"></div>
    <div class="leak"></div>
    <div class="welcome">
      <div class="kicker">Catholic Faith</div>
      <span class="name" id="welcomeName" aria-label="Welcome William"></span>
      <div class="rule"></div>
    </div>
    <div class="enter"><b id="enterText">Trykk Enter for å gå inn</b></div>
  </section>
  <div id="flash"></div>

  <!-- App -->
  <main id="app">
    <div class="bg"></div><div class="bgfade"></div>

    <!-- Hjem -->
    <section class="view active" id="view-home">
      <div class="reveal">
        <header class="top">
          <div class="brand">Catholic Faith<small id="tag">Tro · Lære · Bønn</small></div>
          <div class="tools">
            <div class="lang" role="group" aria-label="Språk"><button data-lang="no" class="on">NO</button><button data-lang="en">EN</button></div>
            <div class="avatar">W</div>
          </div>
        </header>

        <article class="verse">
          <div class="pic paint"></div>
          <div class="meta" id="vMeta"></div>
          <q id="vText"></q>
          <div class="ref" id="vRef"></div>
          <div class="row">
            <button class="btn gold" id="btnInterpret"></button>
            <button class="btn glass" id="btnShare"></button>
          </div>
        </article>

        <section>
          <div class="journey">
            <div><h2 id="tjTitle" style="margin-top:26px"></h2><div class="sub" id="tjSub"></div></div>
            <div class="streak"><svg width="16" height="16" viewBox="0 0 24 24" fill="#D9822B"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-1-.4-2-1-3 3 1 5 4 5 7a7 7 0 01-14 0c0-6 7-8 7-13z"/></svg><span id="streak">0</span></div>
          </div>
          <div class="days" id="days"></div>
          <button class="begin" id="btnBegin"></button>
        </section>

        <section>
          <h2 id="chatTitle"></h2>
          <div class="chatrow" id="cats"></div>
        </section>
      </div>
    </section>

    <!-- Listen -->
    <section class="view" id="view-listen">
      <div class="reveal"><div class="empty"><h1 id="lTitle"></h1><p id="lText"></p></div></div>
    </section>

    <!-- Read -->
    <section class="view" id="view-read">
      <div class="reveal"><div id="readRoot"></div></div>
    </section>
    <div class="selbar" id="selbar"><button id="selCopy"></button><button class="g" id="selShare"></button></div>

    <nav class="tabs" aria-label="Hovedmeny">
      <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span id="tHome"></span></button>
      <button data-tab="listen"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg><span id="tListen"></span></button>
      <button data-tab="read"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/></svg><span id="tRead"></span></button>
    </nav>
    <div id="toast"></div>
  </main>
</div>

<script>
/* ---------- Tekster (norsk/engelsk) ---------- */
const T={
 no:{enter:"Trykk Enter for å gå inn",enterTouch:"Trykk for å gå inn",tag:"Tro · Lære · Bønn",daily:"Dagens vers",interpret:"Tolk",share:"Del",
     journey:"Dagens reise",day:"Dag",begin:"Begynn",done:"Fullført i dag",chat:"Snakk med Catholic Faith",
     home:"Hjem",listen:"Lytt",read:"Les",
     soonChat:"AI-chatten kommer i neste steg.",copied:"Kopiert til utklippstavlen",
     lT:"Lytt",lX:"Historier, bibellesning og podcaster kommer her.",rT:"Les",rX:"Bibelen med alle 73 bøker kommer her.",
     lessons:["Jesus og apostlene","Den tidlige kirken","Apostolisk suksesjon","Bibelens kanon","De første konsilene","Kirkefedrene","Middelalderen"],
     cats:["Spør om hva som helst","Håndtere stress","Apostolisk suksesjon","Kirkens historie","Helgener og forbilder","Sakramentene"],
     wd:["S","M","T","O","T","F","L"]},
 en:{enter:"Press Enter to continue",enterTouch:"Tap to continue",tag:"Faith · Teaching · Prayer",daily:"Daily Verse",interpret:"Interpret",share:"Share",
     journey:"Today's journey",day:"Day",begin:"Begin",done:"Completed today",chat:"Chat with Catholic Faith",
     home:"Home",listen:"Listen",read:"Read",
     soonChat:"AI chat arrives in the next step.",copied:"Copied to clipboard",
     lT:"Listen",lX:"Stories, scripture readings and podcasts will live here.",rT:"Read",rX:"The Bible with all 73 books will live here.",
     lessons:["Jesus and the Apostles","The Early Church","Apostolic Succession","The Biblical Canon","The First Councils","The Church Fathers","The Middle Ages"],
     cats:["Ask me anything","Handling stress","Apostolic succession","Church history","Saints and role models","The Sacraments"],
     wd:["S","M","T","W","T","F","S"]}
};
/* Vers i det fri (King James) */
const VERSES=[
 ["Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.","Psalm 46:10"],
 ["The Lord is my shepherd; I shall not want.","Psalm 23:1"],
 ["Thou art Peter, and upon this rock I will build my church; and the gates of hell shall not prevail against it.","Matthew 16:18"],
 ["I am the way, the truth, and the life: no man cometh unto the Father, but by me.","John 14:6"],
 ["And we know that all things work together for good to them that love God.","Romans 8:28"],
 ["I can do all things through Christ which strengtheneth me.","Philippians 4:13"],
 ["For God so loved the world, that he gave his only begotten Son.","John 3:16"]
];
/* Utsnitt av maleriet til kategorikort (plassholdere til egne bilder) */
const CROPS=[["230%","48% 8%"],["300%","92% 72%"],["330%","6% 88%"],["260%","78% 4%"],["320%","40% 62%"],["290%","24% 30%"]];

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('cf_lang','no');
const isTouch=matchMedia('(pointer:coarse)').matches;
const today=new Date(), todayKey=today.toISOString().slice(0,10);
const dayOfYear=Math.floor((today-new Date(today.getFullYear(),0,0))/864e5);

/* Velkomst: bokstav for bokstav */
const nm=$('#welcomeName'); const WORD="Welcome William";
[...WORD].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;s.style.animationDelay=(2.5+i*.07)+'s';nm.appendChild(s)});
/* På smal skjerm: to linjer */
{nm.innerHTML='';["Welcome","William"].forEach((w,wi)=>{const line=document.createElement('div');[...w].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(2.5+(wi*8+i)*.07)+'s';line.appendChild(s)});nm.appendChild(line)})}

/* Gå inn */
let entered=false;
function enter(){
  if(entered)return; entered=true;
  const sp=$('#splash'); sp.classList.add('leaving'); $('#flash').classList.add('go');
  setTimeout(()=>{$('#app').classList.add('on')},380);
  setTimeout(()=>{sp.remove()},1100);
}
addEventListener('keydown',e=>{if(!entered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();enter()}});
$('#splash').addEventListener('pointerdown',enter);

/* ---------- LES: Bibelen (Douay-Rheims, fri tekst) ---------- */
const R={
 no:{title:"Les",lead:"Bibelen med alle 73 bøker",ot:"Det gamle",nt:"Det nye",search:"Søk etter bok …",resume:"Fortsett å lese",
     chapter:"Kapittel",chapters:"kapitler",back:"‹ Alle bøker",prev:"‹ Forrige",next:"Neste ›",copy:"Kopier",share:"Del",copied:"Vers kopiert",
     none:"Ingen bøker funnet",fail:"Kunne ikke laste teksten. Sjekk nettet og prøv igjen.",loading:"Laster …",deu:"Deuterokanonisk bok",
     src:"Tekst: Douay-Rheims (Challoner), fri tekst på engelsk. Den norske teksten kommer senere. Les også Legacy Standard Bible (LSB):",psalm:"Merk: Salmene er nummerert etter Vulgata, så tallene kan avvike litt fra protestantiske bibler."},
 en:{title:"Read",lead:"The Bible with all 73 books",ot:"Old",nt:"New",search:"Search for a book …",resume:"Continue reading",
     chapter:"Chapter",chapters:"chapters",back:"‹ All books",prev:"‹ Previous",next:"Next ›",copy:"Copy",share:"Share",copied:"Verse copied",
     none:"No books found",fail:"Could not load the text. Check your connection and try again.",loading:"Loading …",deu:"Deuterocanonical book",
     src:"Text: Douay-Rheims (Challoner), public-domain English. Read the Legacy Standard Bible (LSB) too:",psalm:"Note: the Psalms follow Vulgate numbering, so numbers can differ slightly from Protestant Bibles."}
};
const DEU_BOOKS=new Set([17,18,25,26,30,45,46]); // Tobit, Judit, Visdom, Sirak, Baruk, 1-2 Makkabeer
let BIDX=null, BCACHE={}, rs={mode:'books',nt:0,q:'',book:0,ch:0}, sel=new Set();
const rsaved=()=>{try{return JSON.parse(store.get('cf_read','null'))}catch(e){return null}};
const rsize=()=>+store.get('cf_rsize','20');
const bname=b=>lang==='no'?b.no:b.en.replace(/^III /,'3 ').replace(/^II /,'2 ').replace(/^I /,'1 ').replace('Revelation of John','Revelation').replace('Song of Solomon','Song of Songs');
const bookById=id=>BIDX&&BIDX.find(b=>b.id===id);
fetch('bible/index.json').then(r=>r.json()).then(j=>{BIDX=j;renderRead()}).catch(()=>{});
async function loadBook(id){
  if(BCACHE[id])return BCACHE[id];
  const r=await fetch('bible/'+id+'.json'); if(!r.ok)throw new Error('x');
  return BCACHE[id]=await r.json();
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function clearSel(){sel.clear();$('#selbar').classList.remove('show');$$('.text .v.sel').forEach(x=>x.classList.remove('sel'))}
function renderRead(){
  const root=$('#readRoot'); if(!root)return; const t=R[lang]; clearSel(); root.innerHTML='';
  $('#selCopy').textContent=t.copy; $('#selShare').textContent=t.share;
  const wrap=mk('div','rd'); root.appendChild(wrap);
  if(!BIDX){wrap.appendChild(mk('div','lead',t.loading));return}
  if(rs.mode==='books'){
    wrap.appendChild(mk('h1','',t.title)); wrap.appendChild(mk('div','lead',t.lead));
    const sv=rsaved(), sb=sv&&bookById(sv.book);
    if(sb&&!rs.q){const r=mk('button','resume'); r.appendChild(mk('small','',t.resume)); r.appendChild(mk('b','',bname(sb)+' '+sv.ch)); r.onclick=()=>openChapter(sv.book,sv.ch); wrap.appendChild(r)}
    const seg=mk('div','seg');
    [[0,t.ot],[1,t.nt]].forEach(([v,l])=>{const b=mk('button',rs.nt===v?'on':'',l);b.onclick=()=>{rs.nt=v;rs.q='';renderRead()};seg.appendChild(b)});
    wrap.appendChild(seg);
    const s=mk('input','search'); s.type='search'; s.placeholder=t.search; s.value=rs.q; s.autocomplete='off';
    wrap.appendChild(s);
    const grid=mk('div','books'); wrap.appendChild(grid);
    const fill=()=>{
      grid.innerHTML=''; const q=rs.q.trim().toLowerCase();
      const list=BIDX.filter(b=>q?(b.no+' '+bname(b)+' '+b.en).toLowerCase().includes(q):(b.nt?1:0)===rs.nt);
      if(!list.length){grid.appendChild(mk('div','lead',t.none))}
      list.forEach(b=>{const e=mk('button','book'+(DEU_BOOKS.has(b.id)?' deu':''),bname(b)); e.appendChild(mk('small','',b.ch+' '+t.chapters)); e.onclick=()=>{rs.book=b.id;rs.mode='chapters';renderRead();$('#view-read').scrollTop=0}; grid.appendChild(e)});
    };
    s.oninput=()=>{rs.q=s.value;fill()}; fill();
  } else if(rs.mode==='chapters'){
    const b=bookById(rs.book);
    const back=mk('button','back',t.back); back.onclick=()=>{rs.mode='books';renderRead()}; wrap.appendChild(back);
    wrap.appendChild(mk('h1','',bname(b))); wrap.appendChild(mk('div','lead',b.ch+' '+t.chapters+(DEU_BOOKS.has(b.id)?' · '+t.deu:'')));
    const g=mk('div','chs'); for(let i=1;i<=b.ch;i++){const e=mk('button','',String(i));e.onclick=()=>openChapter(b.id,i);g.appendChild(e)} wrap.appendChild(g);
  } else {
    const b=bookById(rs.book); const back=mk('button','back',t.back); back.onclick=()=>{rs.mode='chapters';renderRead();$('#view-read').scrollTop=0}; wrap.appendChild(back);
    wrap.appendChild(mk('h1','',bname(b)+' '+rs.ch));
    const tools=mk('div','rtools'); tools.appendChild(mk('div','lead',lang==='no'?'Trykk på et vers for å kopiere eller dele':'Tap a verse to copy or share'));
    const sz=mk('div','sz'); [['A−',-2],['A+',2]].forEach(([l,d])=>{const x=mk('button','',l);x.onclick=()=>{store.set('cf_rsize',String(Math.min(30,Math.max(15,rsize()+d))));const tx=$('.text');if(tx)tx.style.fontSize=rsize()+'px'};sz.appendChild(x)});
    tools.appendChild(sz); wrap.appendChild(tools);
    const box=mk('div','text'); box.style.fontSize=rsize()+'px'; wrap.appendChild(box);
    box.appendChild(mk('div','lead',t.loading));
    loadBook(b.id).then(d=>{
      if(rs.mode!=='text'||rs.book!==b.id)return; box.innerHTML='';
      const p=mk('p'); d[rs.ch-1].forEach((v,i)=>{const s=mk('span','v'); s.dataset.n=i+1; const n=mk('sup','',String(i+1)); s.appendChild(n); s.appendChild(document.createTextNode(v+' ')); p.appendChild(s)});
      box.appendChild(p);
      box.onclick=e=>{const v=e.target.closest('.v'); if(!v)return; const n=+v.dataset.n; sel.has(n)?sel.delete(n):sel.add(n); v.classList.toggle('sel',sel.has(n)); $('#selbar').classList.toggle('show',sel.size>0)};
    }).catch(()=>{box.innerHTML='';box.appendChild(mk('div','lead',t.fail))});
    const nav=mk('div','chnav'); const pv=mk('button','',t.prev), nx=mk('button','',t.next);
    pv.disabled=(rs.book===1&&rs.ch===1); nx.disabled=(rs.book===73&&rs.ch===b.ch);
    pv.onclick=()=>stepChapter(-1); nx.onclick=()=>stepChapter(1); nav.appendChild(pv); nav.appendChild(nx); wrap.appendChild(nav);
    if(b.id===21)wrap.appendChild(mk('div','src',t.psalm));
    const src=mk('div','src',t.src+' '); const a=mk('a','','lsbible.org'); a.href='https://read.lsbible.org/'; a.target='_blank'; a.rel='noopener'; src.appendChild(a); wrap.appendChild(src);
  }
}
function openChapter(id,ch){rs.book=id;rs.ch=ch;rs.mode='text';store.set('cf_read',JSON.stringify({book:id,ch}));renderRead();$('#view-read').scrollTop=0}
function stepChapter(d){
  let id=rs.book, ch=rs.ch+d, b=bookById(id);
  if(ch<1){id--; b=bookById(id); ch=b.ch} else if(ch>b.ch){id++; ch=1}
  openChapter(id,ch);
}
function selText(){
  const b=bookById(rs.book), d=BCACHE[rs.book]; const ns=[...sel].sort((a,c)=>a-c);
  const body=ns.map(n=>(ns.length>1?n+' ':'')+d[rs.ch-1][n-1]).join(' ');
  const ref=bname(b)+' '+rs.ch+':'+(ns.length===1?ns[0]:ns[0]+(ns.length>1&&ns[ns.length-1]-ns[0]===ns.length-1?'–':',')+ns[ns.length-1]);
  return '“'+body+'” — '+ref;
}
$('#selCopy').addEventListener('click',async()=>{const x=selText();try{await navigator.clipboard.writeText(x);toast(R[lang].copied)}catch(e){toast(x)}clearSel()});
$('#selShare').addEventListener('click',async()=>{const x=selText();try{if(navigator.share){await navigator.share({text:x});clearSel();return}}catch(e){return}try{await navigator.clipboard.writeText(x);toast(R[lang].copied)}catch(e){toast(x)}clearSel()});

/* Tekster og innhold */
function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  const et=$('#enterText'); if(et) et.textContent=isTouch?t.enterTouch:t.enter;
  $('#tag').textContent=t.tag; $('#vMeta').textContent=t.daily+' · '+today.toLocaleDateString(lang==='no'?'nb-NO':'en-GB',{day:'numeric',month:'long'});
  const v=VERSES[dayOfYear%VERSES.length]; $('#vText').textContent=v[0]; $('#vRef').textContent=v[1];
  $('#btnInterpret').textContent=t.interpret+' ›'; $('#btnShare').textContent=t.share+' ↗';
  const lesson=dayOfYear%t.lessons.length;
  $('#tjTitle').textContent=t.journey; $('#tjSub').textContent=t.day+' '+(lesson+1)+' · '+t.lessons[lesson];
  $('#chatTitle').textContent=t.chat;
  $('#tHome').textContent=t.home;$('#tListen').textContent=t.listen;$('#tRead').textContent=t.read;
  $('#lTitle').textContent=t.lT;$('#lText').textContent=t.lX;renderRead();
  $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  // uke
  const dow=today.getDay(), done=store.get('cf_done','');
  $('#days').innerHTML=t.wd.map((d,i)=>`<div class="day ${i===dow?'today':''} ${i===dow&&done===todayKey?'done':''}">${d}</div>`).join('');
  $('#streak').textContent=store.get('cf_streak','0');
  const b=$('#btnBegin'); const isDone=done===todayKey; b.classList.toggle('done',isDone); b.textContent=isDone?'✓ '+t.done:t.begin;
  // kategorikort
  $('#cats').innerHTML=t.cats.map((c,i)=>`<button class="cat" data-i="${i}"><div class="pic paint" style="background-size:${CROPS[i][0]};background-position:${CROPS[i][1]}"></div><span>${c}</span></button>`).join('');
}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}

/* Handlinger */
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;store.set('cf_lang',lang);render()}));
$('#btnBegin').addEventListener('click',()=>{
  if(store.get('cf_done','')===todayKey)return;
  const y=new Date(today-864e5).toISOString().slice(0,10);
  const s=store.get('cf_done','')===y?+store.get('cf_streak','0')+1:1;
  store.set('cf_streak',String(s)); store.set('cf_done',todayKey); render();
});
$('#btnInterpret').addEventListener('click',()=>toast(T[lang].soonChat));
$('#cats').addEventListener('click',e=>{if(e.target.closest('.cat'))toast(T[lang].soonChat)});
$('#btnShare').addEventListener('click',async()=>{
  const v=VERSES[dayOfYear%VERSES.length], txt='“'+v[0]+'” — '+v[1];
  try{ if(navigator.share){await navigator.share({text:txt}); return} }catch(e){ return }
  try{await navigator.clipboard.writeText(txt);toast(T[lang].copied)}catch(e){toast(txt)}
});
$$('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{
  $$('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.view').forEach(v=>v.classList.remove('active'));
  const v=$('#view-'+b.dataset.tab); v.classList.add('active'); v.scrollTop=0;
  v.querySelectorAll('.reveal>*').forEach(el=>{el.style.animation='none';el.offsetHeight;el.style.animation=''});
}));
render();
</script>
